{% extends "base.html" %}

{% block title %}Admin Login{% endblock %}

{% block content %}
<section class="section">
  <h2>👑 Admin Login</h2>
  <form method="POST" class="reg-form admin-login-box">
    <p class="tiny" style="text-align:center;">Restricted — officials only</p>
    <div class="form-group"><label>Admin Email</label>
      <input type="email" name="email" placeholder="admin@kaddx.com" required></div>
    <div class="form-group"><label>Password</label>
      <input type="password" name="password" placeholder="Enter admin password" required></div>
    <button type="submit" class="btn">Login as Admin</button>
    {% if error %}<p class="form-msg error">{{ error }}</p>{% endif %}
    <p class="form-msg" style="margin-top:20px;">
      Official admin access only.
    </p>
  </form>
</section>
{% endblock %}
