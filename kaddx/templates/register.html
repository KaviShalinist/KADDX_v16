{% extends "base.html" %}

{% block title %}Create Account{% endblock %}

{% block content %}
<section class="section">
  <h2>Create Account</h2>
  <p style="text-align:center; color:var(--dim); margin-bottom:25px;">
    Join the CM Trophy Kabaddi tournament
  </p>
  <form method="POST" class="reg-form">
    <div class="form-group"><label>Full Name</label>
      <input type="text" name="name" placeholder="e.g. Karthik Raja" required></div>
    <div class="form-group"><label>Email</label>
      <input type="email" name="email" placeholder="you@example.com" required></div>
    <div class="form-group"><label>Password</label>
      <input type="password" name="password" placeholder="Choose a password (min 4 chars)" required></div>
    <div class="form-group"><label>Confirm Password</label>
      <input type="password" name="confirm_password" placeholder="Re-enter password" required></div>
    <div class="form-group"><label>I am a...</label>
      <div class="role-cards">
        <label class="role-card selected">
          <input type="radio" name="role" value="player" checked>
          <div class="r-icon">🤼</div>
          <div class="r-name">Player</div>
          <div class="r-desc">Join team, track stats</div>
        </label>
        <label class="role-card">
          <input type="radio" name="role" value="manager">
          <div class="r-icon">📋</div>
          <div class="r-name">Team Manager</div>
          <div class="r-desc">Manage your team</div>
        </label>
      </div>
    </div>
    <button type="submit" class="btn">Create Account</button>
    {% if error %}<p class="form-msg error">{{ error }}</p>{% endif %}
    <p class="form-msg" style="margin-top:18px;">
      Already have an account? <a href="{{ url_for('login') }}" class="link-gold">Login →</a>
    </p>
  </form>
</section>

<script>
// role card selection highlight
document.querySelectorAll('.role-card input').forEach(inp => {
  inp.addEventListener('change', () => {
    document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
    inp.closest('.role-card').classList.add('selected');
  });
});
</script>
{% endblock %}
